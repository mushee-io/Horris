name: Horris CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: horris-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node --check scripts/register-discord.mjs && node --check scripts/verify-deployment.mjs && node --check scripts/verify-updown.mjs && node --check scripts/verify-perp-guard.mjs && node --check scripts/verify-release.mjs
      - run: npm run verify:release
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
      - run: forge test -vv
      - run: forge build --sizes
